services:
  mysql:
    image: mysql:8.4
    container_name: ifood-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ifood
      MYSQL_USER: ifood_user
      MYSQL_PASSWORD: ifood_password
    
    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: